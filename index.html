



<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="apple-mobile-web-app-title" content="来局日計算">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>次回来局日計算機</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Zen+Kaku+Gothic+Antique:wght@400;500;700&display=swap" rel="stylesheet">
<style>

  button {
    padding: 12px 18px;
    border: 1px solid #aaa;
    border-radius: 8px;
    background-color: white;
    cursor: pointer;
  }


  
button.selected {
  background-color: #e0e0e0;
  color: #333;
}


#custom-days.selected {
  background-color: #DCE5ED;
  border: 1px solid #BCCBD6;
}


#result-date {
  font-family: "Jost", sans-serif;
  font-size: 48px;
  font-weight: normal;
  margin: 24px 0;
  text-align: center;
}


body {
  font-family: "Zen Kaku Gothic Antique", sans-serif;
  max-width: 480px;
  margin: 0 auto;
  padding: 20px;
  color: #405448;
}


button,
input {
  font-family: inherit;
}


#days-buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 32px;
}


#days-buttons button {
  min-height: 72px;
  padding: 10px;
  font-size: 20px;
}


#visit-date {
  font-size: 16px;
  padding: 12px;
  border: 1px solid #B8C9BC;
  border-radius: 8px;
  box-sizing: border-box;
  max-width: 100%;
  margin-top: 12px;
  width: 100%;
  margin-bottom: 20px;
  background-color: #ffffff;
  -webkit-appearance: none;
}

label[for="visit-date"] {
  font-size: 18px;
}

label[for="custom-days"] {
  font-size: 18px;
}


.custom-days-area {
  margin-top: 0;
}

.custom-days-row {
  display: flex;
  gap: 8px;
  margin-top: 0;
}


#custom-days {
  flex: 1;
  min-width: 0;
  padding: 12px;
  font-size: 16px;
  border: 1px solid #BCCBD6;
  border-radius: 8px;
  box-sizing: border-box;
  caret-color: #405448;
}

#custom-days:focus {
  outline: none;
  border: 1px solid #BCCBD6;
  box-shadow: 0 0 0 2px #DCE5ED;
}


#custom-days-ok {
  width: 72px;
  min-height: 48px;
  font-size: 16px;
  border: 1px solid #BCCBD6;
}


hr {
  border: none;
  border-top: 1px solid #CFC5B7;
  margin: 20px 0;
}


#reset-button {
  width: 100%;
  min-height: 52px;
  margin-top: 20px;
}


h1 {
  text-align: center;
  letter-spacing: 2px;
  font-weight: normal;
  font-size: 26px;
  margin-bottom: 56px;
}


#today-button,
#yesterday-button {
  border-color: #B8C9BC;
  text-align: center;
}

#today-button.selected,
#yesterday-button.selected {
  background-color: #DCE7DF;
  color: #405448;
}

#today-button,
#yesterday-button {
  font-size: 18px;
  min-height: 56px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.button-date {
  display: block;
  white-space: nowrap;
  margin-top: 6px;
  font-size: 16px;
}


#days-buttons button {
  border-color: #BCCBD6;
}

#days-buttons button.selected {
  background-color: #DCE5ED;
  color: #405448;
}


#reset-button {
  background-color: #E7E0D5;
  border-color: #CFC5B7;
  color: #405448;
  font-size: 16px;
}


label[for="visit-date"] {
  display: block;
  margin-bottom: 20px;
  text-align: center;
}


h2 {
  font-weight: normal;
  text-align: center;
  font-size: 18px;
  margin-top: 0;
  margin-bottom: 20px;
}


#date-buttons {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}


label[for="custom-days"] {
  display: block;
  text-align: center;
  margin-bottom: 8px;
}


#selected-days-text {
  text-align: center;
  color: #82988A;
}


#result-detail {
  text-align: center;
  color: #82988A;
  font-size: 18px;
}

#selected-days-text {
  text-align: center;
  color: #858C87;
  font-size: 18px;
  margin: 24px 0;
}

#result-conditions {
  display: none;
  grid-template-columns: max-content max-content max-content;
  column-gap: 6px;
  row-gap: 6px;
  justify-content: center;
  align-items: center;
  margin-top: 18px;
  font-size: 16px;
}

#result-conditions span:nth-child(3n + 1) {
  text-align: right;
}

#result-conditions span:nth-child(3n + 3) {
  text-align: left;
}


button,
input {
  color: #405448;
  -webkit-text-fill-color: #405448;
}

</style>

</head>
<body>

  <h1>次回来局日計算機</h1>
 

<label for="visit-date">今回の来局日</label>

<div id="date-buttons">
  <button id="today-button">今日</button>
  <button id="yesterday-button">昨日</button>
</div>

<input type="date" id="visit-date">


<h2>処方日数</h2>

<div id="days-buttons">
  <button>14日</button>
  <button>21日</button>
  <button>28日</button>
  <button>30日</button>
  <button>35日</button>
  <button>40日</button>
  <button>42日</button>
  <button>49日</button>
  <button>50日</button>
  <button>56日</button>
  <button>60日</button>
  <button>62日</button>
  <button>63日</button>
  <button>70日</button>
  <button>77日</button>
  <button>84日</button>
  <button>90日</button>
  <button>91日</button>
  <button>120日</button>
</div>



<div class="custom-days-area">
  <label for="custom-days">その他の日数</label>
  <div class="custom-days-row">
    <input type="number" id="custom-days" min="1" inputmode="numeric" placeholder="日数を入力">
    <button id="custom-days-ok">OK</button>
  </div>
</div>


<p id="selected-days-text">処方日数を選んでね</p>

<hr>
<h2>次回来局の目安</h2>

<p id="result-date">— / —</p>
<p id="result-detail">日数を選ぶと結果が表示されます</p>
<div id="result-conditions">
  <span>今回の来局日</span>
  <span>：</span>
  <span id="condition-date"></span>

  <span>処方日数</span>
  <span>：</span>
  <span id="condition-days"></span>
</div>


<button id="reset-button">次の計算</button>



<script>

  function formatDate(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
  }

  const today = new Date();

document.getElementById("today-button").classList.add("selected");



const weekdays = ["日", "月", "火", "水", "木", "金", "土"];

document.getElementById("today-button").innerHTML =
  `今日<br><span class="button-date">${today.getMonth() + 1}/${today.getDate()} (${weekdays[today.getDay()]})</span>`;


const yesterdayForButton = new Date();
yesterdayForButton.setDate(yesterdayForButton.getDate() - 1);


document.getElementById("yesterday-button").innerHTML =
  `昨日<br><span class="button-date">${yesterdayForButton.getMonth() + 1}/${yesterdayForButton.getDate()} (${weekdays[yesterdayForButton.getDay()]})</span>`;


  document.getElementById("visit-date").value = formatDate(today);

 
document.getElementById("today-button").addEventListener("click", function() {
  document.getElementById("visit-date").value = formatDate(new Date());

  document.getElementById("today-button").classList.add("selected");
  document.getElementById("yesterday-button").classList.remove("selected");

calculateNextDate();
});


 
document.getElementById("yesterday-button").addEventListener("click", function() {
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);

  document.getElementById("visit-date").value = formatDate(yesterday);

  document.getElementById("yesterday-button").classList.add("selected");
  document.getElementById("today-button").classList.remove("selected");

calculateNextDate();
});


document.getElementById("visit-date").addEventListener("change", function() {
  document.getElementById("today-button").classList.remove("selected");
  document.getElementById("yesterday-button").classList.remove("selected");

calculateNextDate();
});


function calculateNextDate() {
  const visitDateText = document.getElementById("visit-date").value;

  
if (!visitDateText || selectedDays === null) {
  document.getElementById("result-date").textContent = "— / —";
  document.getElementById("result-detail").textContent =
    "日付と日数を選んでね";

  document.getElementById("condition-date").textContent = "";
  document.getElementById("condition-days").textContent = "";
  document.getElementById("result-conditions").style.display = "none";

  return;
}


  const [year, month, day] = visitDateText.split("-").map(Number);

  const nextDate = new Date(year, month - 1, day);
  nextDate.setDate(nextDate.getDate() + selectedDays);

  document.getElementById("result-date").textContent =
    `${nextDate.getMonth() + 1}/${nextDate.getDate()}`;

 document.getElementById("result-detail").textContent =
  `${nextDate.getFullYear()}年${nextDate.getMonth() + 1}月${nextDate.getDate()}日(${weekdays[nextDate.getDay()]})`;

document.getElementById("condition-date").textContent =
  `${month}月${day}日(${weekdays[new Date(year, month - 1, day).getDay()]})`;

document.getElementById("condition-days").textContent =
  `${selectedDays}日分`;

document.getElementById("result-conditions").style.display = "grid";

}

function scrollToResult() {
  document.getElementById("result-date").scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}

let selectedDays = null;

const daysButtons = document.querySelectorAll("#days-buttons button");

daysButtons.forEach(function(button) {
  button.addEventListener("click", function() {

    daysButtons.forEach(function(b) {
      b.classList.remove("selected");
    });

    button.classList.add("selected");

document.getElementById("custom-days").classList.remove("selected");
document.getElementById("custom-days").value = "";

selectedDays = parseInt(button.textContent, 10);
 document.getElementById("selected-days-text").textContent =
  `${selectedDays}日分で計算`;
calculateNextDate();

setTimeout(function() {
  scrollToResult();
}, 600);

 });
});


document.getElementById("custom-days-ok").addEventListener("click", function() {
const input = document.getElementById("custom-days");
  const days = Number(input.value);

  if (!Number.isInteger(days) || days < 1 || input.value.trim() === "") {
    alert("1以上の整数を入力してね");
    return;
  }

  selectedDays = days;
input.classList.add("selected");

  daysButtons.forEach(function(button) {
    button.classList.remove("selected");
  });

  document.getElementById("selected-days-text").textContent =
    `${selectedDays}日分で計算`;

  calculateNextDate();
  input.blur();
  scrollToResult();
});


document.getElementById("reset-button").addEventListener("click", function() {
  selectedDays = null;

  daysButtons.forEach(function(button) {
    button.classList.remove("selected");
   
window.scrollTo(0, 0);

  });

  const customInput = document.getElementById("custom-days");
  customInput.value = "";
  customInput.classList.remove("selected");

  document.getElementById("selected-days-text").textContent =
    "処方日数を選んでね";

  document.getElementById("result-date").textContent = "— / —";
  document.getElementById("result-detail").textContent =
    "日数を選ぶと結果が表示されます";

document.getElementById("condition-date").textContent = "";
document.getElementById("condition-days").textContent = "";
document.getElementById("result-conditions").style.display = "none";

});


document.getElementById("custom-days").addEventListener("input", function() {
  this.classList.remove("selected");

  selectedDays = null;

  daysButtons.forEach(function(button) {
    button.classList.remove("selected");
  });

  document.getElementById("selected-days-text").textContent =
    "OKを押して日数を確定してね";

  document.getElementById("result-date").textContent = "— / —";
  document.getElementById("result-detail").textContent =
    "日数を確定すると結果が表示されます";
});



document.getElementById("custom-days").addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    
    document.getElementById("custom-days-ok").click();
  }
});


</script>



</body>
</html>
